[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "football-recruitment-engine"
version = "1.0.0"
description = "Explainable football profiles, similarity and recruitment analytics for local research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
fre = "football_recruitment.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]
build = ["hatchling==1.32.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/football_recruitment"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/THIRD_PARTY_NOTICES.md", "/assets", "/demo", "/scripts", "/src", "/tests", "/config", "/docs", "/README.md", "/PROJECT_HANDOFF.md", "/FINAL_VALIDATION.json", "/NEXT_STEPS.md", "/DATA_LICENSE.md", "/pyproject.toml", "/uv.lock", "/.env.example", "/.python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
required-version = ">=0.6"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
