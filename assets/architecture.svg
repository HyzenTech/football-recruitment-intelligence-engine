<title id="title">Football Recruitment Intelligence Engine — frozen V1 architecture</title>
<desc id="desc">Pinned StatsBomb inputs pass through canonical mapping, quality-gated minutes, missingness-aware features and positional profiles. Profiles feed explained similarity and weighted recruitment engines. Evaluation checks replay and sensitivity, and a loopback FastAPI interface presents four views. Manifests connect each stage.</desc>
